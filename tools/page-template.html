<script>
// Set the theme before first paint to avoid a wrong-theme flash.
(function () {
  var theme = null;
  try {
    var s = JSON.parse(localStorage.getItem('random:state'));
    theme = s && s.settings && s.settings.theme;
  } catch (e) {}
  if (theme !== 'light' && theme !== 'dark') {
    theme = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', theme);
})();
// Home is flagged before first paint so the ad dock (Home only) never shifts the layout.
try {
  var e = document.documentElement, hs = location.hash;
  if (e.getAttribute('data-entry') === '/' && (hs === '' || hs === '#' || hs === '#/')) e.setAttribute('data-home', '');
} catch (err) {}
// Ads are decided before first paint so the ad slot never takes space when off.
try {
  var q = new URLSearchParams(location.search).get('noads');
  if (q === '1') localStorage.setItem('random:noads', '1');
  if (q === '0') localStorage.removeItem('random:noads');
  if (q !== null) history.replaceState(null, '', location.pathname + location.hash);
  if (localStorage.getItem('random:noads') === '1') document.documentElement.setAttribute('data-noads', '');
} catch (e) {}
if (!navigator.onLine || /^(localhost|127\.|\[::1\]$)/.test(location.hostname)) document.documentElement.setAttribute('data-noads', '');
</script>
